<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="orderSuccess.js" defer></script>
    <title>Vanilla Cakes - Order Success</title>
</head>
<body>
    <main class="page-content" id="order-success-content">
        <h1>Order Successfully Placed</h1>
        <dl>
            <dt>Order ID:</dt> <dd>#<span id="order-id"></span></dd>
            <dt>Order Date:</dt> <dd id="order-created-at"></dd>
            <dt>Recipient Name:</dt> <dd id="order-client-name"></dd>
            <dt>Full Address:</dt> <dd id="order-full-address"></dd>
            <dt>Payment Method:</dt> <dd id="order-payment-method"></dd>
        </dl>
        <p>Your delicious cakes will never arrive, but thank you for helping test this project.</p>
    </main>
    <div id="errorMessageDiv" hidden>
        <p id="errorMessageParagraph"></p>
    </div>
</body>
</html>
