<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla Cakes - Cake Detail</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="cakeDetail.js" defer></script>
</head>
<body>
    <main id="cake-information">
        <figure id="cake-figure"></figure>
        <div>
            <h1 id="cake-name"></h1>
            <p id="cake-description"></p>
            <p id="cake-unit-price" class="cake-price"></p>

            <div id="quantity-container"></div>

            <p>Total: <span id="total-price"></span></p>

            <button id="add-to-cart-button" class="primary-button">
                Add to cart
            </button>
        </div>
    </main>

    <div id="errorMessageDiv" hidden>
        <p id="errorMessageParagraph"></p>
    </div>
</body>
</html>
